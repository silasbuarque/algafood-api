# Este é o Resource Bundle do Spring (que é superior ao Resource Bundle do Bean Validation)

NotBlank={0} é obrigatório
NotNull={0} é obrigatório
PositiveOrZero={0} deve ser um valor maior ou igual a zero
Email=Email incorreto. Por favor, insira um email correto.

#ValorZeroIncluiDescricao={1} deve conter {2}


#Este é o Resource Bundle do Bean Validation
#javax.validation.constraints.PositiveOrZero.message  = Valor do frete maior que zero

# Cozinha
cozinhaInput.nome=Nome da cozinha
cozinhaInput.id=Código da cozinha

# Restaurante
NotNull.restauranteInput.taxaFrete={0} é obrigatória
NotNull.restauranteInput.cozinha={0} é obrigatória
restauranteInput.nome=Nome do restaurante
restauranteInput.cozinha=Cozinha do restaurante
restauranteInput.taxaFrete=Taxa de frete do restaurante

# Estado
estadoInput.nome=Nome do estado
estadoInput.id=Código do estado

# Cidade
cidadeInput.nome=Nome da cidade
cidadeInput.estado=Estado da cidade

# Forma de Pagamento
NotBlank.formaPagamentoInput.descricao = {0} é obrigatória
formaPagamentoInput.descricao = Descricao da forma de pagamento

# Endereco
endereco=Endereço
endereco.logradouro=Logradouro
endereco.numero=Número do logradouro
endereco.cidade=Cidade
endereco.cidade.id=Código da cidade
endereco.cep=CEP
endereco.bairro=Bairro

# Grupo
grupoInput.nome=Nome do grupo

# Usuarios
usuarioAdicionarInput.nome=Nome do usuário
usuarioAdicionarInput.senha=Senha do usuário
usuarioAdicionarInput.email=Email do usuário

usuarioAtualizarInput.nome=Nome do usuário
usuarioAtualizarInput.email=Email do usuário

NotBlank.usuarioAlteracaoSenhaInput.senhaAtual={0} é obrigatória
NotBlank.usuarioAlteracaoSenhaInput.novaSenha={0} é obrigatória

usuarioAlteracaoSenhaInput.senhaAtual=Senha atual do usuário
usuarioAlteracaoSenhaInput.novaSenha=Nova senha do usuário

# Produto
produtoInput.nome=Nome do produto
produtoInput.descricao=Descrição do produto
produtoInput.preco=Preço do produto
produtoInput.ativo=Status do produto